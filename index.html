<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Canicas 3D</title>
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas"></canvas>

      <div id="hud">
        <div id="top-bar">
          <div id="score-panel">
            <span class="score-side player" id="score-player-side">
              <span class="score-name">Jugador</span>
              <span id="score-player">0</span>
              <span class="score-money" id="score-money">$0</span>
            </span>
            <span class="score-vs">vs</span>
            <span class="score-side ai">
              <span class="score-name" id="score-ai-name">Rival</span>
              <span id="score-ai">0</span>
            </span>
          </div>
          <div id="meta-panel">
            <span id="turn-label" class="turn-player">Turno: Jugador</span>
            <span id="level-label">Nivel 1</span>
          </div>
        </div>

        <div id="ui-actions" aria-label="Acciones">
          <button id="btn-drop" class="ui-img-btn" type="button" title="Soltar canicas" aria-label="Soltar canicas">
            <img src="ui/btn-drop.png" alt="" draggable="false" />
          </button>
          <button id="btn-replay" class="ui-img-btn" type="button" disabled title="Repetición" aria-label="Repetición">
            <img src="ui/btn-replay.png" alt="" draggable="false" />
          </button>
          <button id="btn-hud-restart" class="ui-img-btn" type="button" title="Reiniciar nivel" aria-label="Reiniciar nivel">
            <img src="ui/btn-restart.png" alt="" draggable="false" />
          </button>
          <button id="btn-pause" class="ui-img-btn" type="button" title="Pausa" aria-label="Pausa">
            <img src="ui/btn-pause.png" alt="" draggable="false" />
          </button>
        </div>

        <p id="instructions">Orbitar · Zoom · En tu turno: arrastra sobre tu canica para disparar</p>

        <div id="power-wrap" class="hidden" aria-hidden="true">
          <div id="power-label">Potencia</div>
          <div id="power-bar-bg">
            <div id="power-bar"></div>
          </div>
          <div id="power-pct"></div>
        </div>
      </div>

      <div id="pause-overlay" class="hidden" aria-hidden="true">
        <div id="pause-card" role="dialog" aria-modal="true" aria-labelledby="pause-title">
          <button id="btn-pause-close" type="button" title="Continuar" aria-label="Cerrar">×</button>
          <h2 id="pause-title">Pausa</h2>
          <p>El juego está en pausa.</p>
        </div>
      </div>

      <div id="location-banner" class="hidden">Tu canica está aquí</div>
      <div id="replay-banner" class="hidden">▶ Repetición</div>

      <div id="replay-controls" class="hidden" aria-label="Controles de repetición">
        <button id="replay-btn-back" type="button" title="Rebobinar">⏪</button>
        <button id="replay-btn-play" type="button" title="Reproducir / Pausar">▶</button>
        <button id="replay-btn-fwd" type="button" title="Avanzar">⏩</button>
        <button id="replay-btn-stop" type="button" title="Detener">⏹</button>
        <input id="replay-scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Posición" />
        <label class="replay-speed-label" for="replay-speed">Vel
          <select id="replay-speed" aria-label="Velocidad">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <button id="replay-btn-exit" type="button">Salir</button>
      </div>

      <div id="money-toast" class="hidden">+$2</div>
      <div id="punch-overlay" aria-hidden="true"></div>

      <div id="end-screen" class="hidden">
        <div id="end-card">
          <h1 id="end-title">¡Victoria!</h1>
          <p id="end-message"></p>
          <p id="end-score"></p>
          <div id="end-actions">
            <button id="btn-restart" type="button">Jugar de nuevo</button>
            <button id="btn-end-replay" type="button">Repetición</button>
          </div>
        </div>
      </div>

      <div id="settle-banner" class="hidden">Esperando a que se detengan las canicas…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
