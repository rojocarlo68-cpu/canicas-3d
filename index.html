<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/canicas-3d/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Canicas 3D</title>
    <script type="module" crossorigin src="/canicas-3d/assets/index-Djmi5dVl.js"></script>
    <link rel="stylesheet" crossorigin href="/canicas-3d/assets/index-BI71Mmwc.css">
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas"></canvas>

      <div id="hud">
        <div id="top-bar">
          <button id="btn-drop" type="button">Soltar canicas</button>
          <div id="score-panel">
            <span class="score-side player" id="score-player-side">
              <span class="score-name">Jugador</span>
              <span id="score-player">0</span>
              <span class="score-money" id="score-money">$0</span>
            </span>
            <span class="score-vs">vs</span>
            <span class="score-side ai">
              <span class="score-name" id="score-ai-name">Rival</span>
              <span id="score-ai">0</span>
            </span>
          </div>
          <div id="meta-panel">
            <span id="turn-label" class="turn-player">Turno: Jugador</span>
            <span id="level-label">Nivel 1</span>
          </div>
          <button id="btn-replay" type="button" disabled title="Repetición de los últimos ~10 s">Repetición</button>
        </div>

        <p id="instructions">Orbitar · Zoom · En tu turno: arrastra sobre tu canica para disparar</p>

        <div id="control-mode-badge" aria-live="polite">
          <span id="control-mode-label">Modo: Flick</span>
          <span id="control-mode-toggle" class="control-toggle">
            <a id="link-flick" href="?control=flick">Flick</a>
            <span aria-hidden="true">·</span>
            <a id="link-push" href="?control=push">Empuje</a>
          </span>
        </div>

        <div id="power-wrap" class="hidden" aria-hidden="true">
          <div id="power-label">Potencia</div>
          <div id="power-bar-bg">
            <div id="power-bar"></div>
          </div>
          <div id="power-pct"></div>
        </div>
      </div>

      <div id="location-banner" class="hidden">Tu canica está aquí</div>
      <div id="replay-banner" class="hidden">▶ Repetición</div>

      <div id="replay-controls" class="hidden" aria-label="Controles de repetición">
        <button id="replay-btn-back" type="button" title="Rebobinar">⏪</button>
        <button id="replay-btn-play" type="button" title="Reproducir / Pausar">▶</button>
        <button id="replay-btn-fwd" type="button" title="Avanzar">⏩</button>
        <button id="replay-btn-stop" type="button" title="Detener">⏹</button>
        <input id="replay-scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Posición" />
        <label class="replay-speed-label" for="replay-speed">Vel
          <select id="replay-speed" aria-label="Velocidad">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <button id="replay-btn-exit" type="button">Salir</button>
      </div>

      <div id="money-toast" class="hidden">+$2</div>
      <div id="punch-overlay" aria-hidden="true"></div>

      <div id="end-screen" class="hidden">
        <div id="end-card">
          <h1 id="end-title">¡Victoria!</h1>
          <p id="end-message"></p>
          <p id="end-score"></p>
          <div id="end-actions">
            <button id="btn-restart" type="button">Jugar de nuevo</button>
            <button id="btn-end-replay" type="button">Repetición</button>
          </div>
        </div>
      </div>

      <div id="settle-banner" class="hidden">Esperando a que se detengan las canicas…</div>
    </div>
  </body>
</html>
